name: hygiene

# Guards the public history: every commit must carry the noreply identity.
#
# The local `user.email` setting only covers one clone on one machine. This check runs
# for every push and every pull request, so a commit made from another clone, another
# machine or a tool that writes its own identity is caught while it is still a branch
# tip here -- before it can become part of the published history.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  identities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Every commit must use the noreply address
        run: |
          set -eu
          allowed='@users\.noreply\.github\.com$'
          bad="$(git log --all --format='%ae%n%ce' | sort -u | grep -vE "$allowed" || true)"
          if [ -n "$bad" ]; then
            echo "::error::these author/committer addresses are not allowed in this repository:"
            echo "$bad"
            exit 1
          fi
          echo "ok: every commit uses the noreply address"
